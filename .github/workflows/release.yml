name: Release

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Manual only — local release is .vscode/release.ps1"
        required: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Read and check version
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' desktop/__init__.py | head -n 1)"
          if [[ -z "$APP_VERSION" ]]; then
            echo "Could not read __version__ from desktop/__init__.py" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            TAG_VERSION="${TAG#v}"
            if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
              echo "Tag $TAG does not match __version__ $APP_VERSION" >&2
              exit 1
            fi
          fi

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Ensure Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if ($iscc) {
            Write-Host "ISCC already present: $iscc"
            exit 0
          }
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup failed: $LASTEXITCODE" }
      - name: Build Windows client and installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\.vscode\setup.ps1" -Target build
      - name: Package Windows artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ needs.version.outputs.version }}'
          $srcSetup = Join-Path $env:GITHUB_WORKSPACE 'dist\ERGOMS SECURE CONNECTION-Setup.exe'
          $srcDir = Join-Path $env:GITHUB_WORKSPACE 'dist\ERGOMS SECURE CONNECTION'
          if (-not (Test-Path -LiteralPath $srcSetup)) { throw "missing $srcSetup" }
          if (-not (Test-Path -LiteralPath $srcDir)) { throw "missing $srcDir" }
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $srcSetup -Destination (Join-Path $out "ERGOMS-SECURE-CONNECTION-$ver-windows-x64-setup.exe")
          $zip = Join-Path $out "ERGOMS-SECURE-CONNECTION-$ver-windows-x64.zip"
          & tar.exe -a -c -f $zip -C (Join-Path $env:GITHUB_WORKSPACE 'dist') 'ERGOMS SECURE CONNECTION'
          if ($LASTEXITCODE -ne 0) { throw "tar zip failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/*
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install Qt / PyInstaller system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            patchelf \
            libgl1 \
            libegl1 \
            libglib2.0-0t64 \
            libdbus-1-3 \
            libfontconfig1 \
            libx11-6 \
            libxext6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0
      - name: Build Linux client
        run: |
          chmod +x .vscode/setup.sh
          ./.vscode/setup.sh build
      - name: Package Linux artifact
        run: |
          set -euo pipefail
          VER='${{ needs.version.outputs.version }}'
          BIN='dist/ERGOMS SECURE CONNECTION/ERGOMS SECURE CONNECTION'
          if [[ ! -x "$BIN" ]]; then
            echo "missing executable: $BIN" >&2
            exit 1
          fi
          mkdir -p artifacts
          tar -C dist -czf "artifacts/ERGOMS-SECURE-CONNECTION-${VER}-linux-x64.tar.gz" \
            "ERGOMS SECURE CONNECTION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [version, windows, linux]
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && (needs.windows.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ERGOMS SECURE CONNECTION ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
