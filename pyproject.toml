[project]
name = "ergoms-secure-connection"
version = "1.2.8"
description = "ERGOMS SECURE CONNECTION — клиент VLESS+Reality через корпоративный Squid на VPS"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6_Essentials>=6.6"]
build = ["pyinstaller>=6.3"]
test = ["pytest>=8.0"]
lint = ["ruff>=0.9", "mypy>=1.14"]

[project.scripts]
ergoms-sc = "desktop.__main__:main"
ergoms-secure-connection = "desktop.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["desktop", "lib", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",
    "B008",
    "B904",
]

[tool.ruff.lint.isort]
known-first-party = ["desktop", "lib"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
exclude = ["modes/", "dist/", "tools/"]

[[tool.mypy.overrides]]
module = "desktop.config.*"
strict = true
check_untyped_defs = true

[tool.poetry]
packages = [
    { include = "desktop" },
    { include = "lib" },
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
